# ==============================================================================
# TenderForge Application Configuration
# ==============================================================================
application:
  name: "TenderForge"
  version: "1.0.0"
  description: "AI-Powered Collaborative Tender Intelligence & Proposal Preparation"
  tagline: "From Tender to Trustworthy Proposal"

workspaces:
  default_id: "ws-default-0000-0000-000000000000"
  default_name: "Default Workspace"
  default_organization_id: "org-default-0000-0000-000000000000"

security:
  enforce_file_signatures: true
  allowed_origins:
    - "http://localhost:8000"
    - "http://localhost:5173"
    - "http://localhost:3000"
    - "http://127.0.0.1:8000"
    - "http://127.0.0.1:5173"
  rate_limit_per_minute: 120
  token_leak_protection: true

logging:
  format: "json"
  include_correlation_id: true
  mask_keys:
    - "api_key"
    - "password"
    - "token"
    - "secret"
    - "authorization"

bid_intelligence:
  config_file: "config/bid_evaluation.yaml"
  auto_evaluate_on_compliance_completion: true
  default_recommendation_grace_margin: 2.0

financial_workspace:
  config_file: "config/financial_policies.yaml"
  enforce_strict_decimal_math: true
  default_export_format: "xlsx"

risk_management:
  config_file: "config/risk_matrix.yaml"
  block_submission_on_high_unmitigated_risk: true

deadlines:
  default_timezone: "UTC"
  default_reminder_hours: [168, 72, 24, 2]
  send_switch_reminders: true

rbac:
  enabled: true
  enforce_workspace_roles: true
  roles:
    - "Viewer"
    - "Author"
    - "Reviewer"
    - "Approver"
    - "Admin"


