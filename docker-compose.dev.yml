version: "3.9"

services:
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: tenderforge_backend_dev
    environment:
      ENVIRONMENT: development
      DEBUG: "true"
      DATABASE_URL: sqlite:///./storage/tenderforge.db
      LOG_LEVEL: DEBUG
      BCRYPT_ROUNDS: 4
    volumes:
      - ./backend:/app/backend
      - ./config:/app/config
      - ./storage:/app/storage
      - ./scripts:/app/scripts
    ports:
      - "8000:8000"
    command: ["uvicorn", "backend.app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload"]

  frontend:
    image: node:22-alpine
    container_name: tenderforge_frontend_dev
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "3000:3000"
    command: ["npm", "run", "dev", "--", "--host"]
