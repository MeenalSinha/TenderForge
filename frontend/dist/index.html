<body class="h-full antialiased selection:bg-brand-500 selection:text-white">
  <div id="root" class="h-full flex flex-col"></div>

  <!-- Main Application Script -->
  <script type="text/babel">
    const { useState, useEffect, useMemo, useRef } = React;

    // API Helper with JWT Authorization
    const API_BASE = '/api/v1';

    function getAuthHeaders() {
      const token = localStorage.getItem('tf_token');
      const headers = { 'Content-Type': 'application/json' };
      if (token) {
        headers['Authorization'] = `Bearer ${token}`;
      }
      return headers;
    }

    async function apiFetch(endpoint, options = {}) {
      const defaultHeaders = getAuthHeaders();
      const headers = options.headers ? { ...defaultHeaders, ...options.headers } : defaultHeaders;
      if (options.body instanceof FormData) {
        delete headers['Content-Type'];
      }

      try {
        const response = await fetch(`${API_BASE}${endpoint}`, {
          ...options,
          headers,
        });

        if (response.status === 401) {
          // Token expired or invalid
          localStorage.removeItem('tf_token');
          window.dispatchEvent(new Event('auth-expired'));
        }

        const data = await response.json();
        return data;
      } catch (err) {
        console.error(`API Error on ${endpoint}:`, err);
        return { success: false, message: err.message || 'Network error' };
      }
    }

    // --- Sub-Components ---

    // Metric KPI Card
    function MetricCard({ title, value, subtext, icon, trend, color = 'brand' }) {
      return (
        <div className="bg-slate-900/80 border border-slate-800 rounded-xl p-5 hover:border-slate-700 transition shadow-sm">
          <div className="flex items-center justify-between">
            <span className="text-xs font-semibold uppercase tracking-wider text-slate-400">{title}</span>
            <span className={`p-2 rounded-lg bg-${color}-500/10 text-${color}-400 text-lg`}>{icon}</span>
          </div>
          <div className="mt-3 flex items-baseline gap-2">
            <span className="text-2xl font-bold text-white tracking-tight">{value}</span>
            {trend && <span className="text-xs font-medium text-emerald-400">{trend}</span>}
          </div>
          {subtext && <p className="mt-1 text-xs text-slate-400">{subtext}</p>}
        </div>
      );
    }

    // Stage Progression Funnel
    function StageBar({ stages, currentStage, onStageClick }) {
      const stageKeys = [
        'WORKSPACE_INITIALIZED',
        'INGESTION',
        'INTELLIGENCE_EXTRACTED',
        'BID_DECISION',
        'COMPLIANCE_EVALUATION',
        'PROPOSAL_DRAFTING',
        'INDEPENDENT_AUDIT',
        'HUMAN_APPROVED',
        'RELEASE_READY'
      ];

      const stageLabels = {
        WORKSPACE_INITIALIZED: 'Setup',
        INGESTION: 'Ingestion',
        INTELLIGENCE_EXTRACTED: 'Intelligence',
        BID_DECISION: 'Bid/No-Bid',
        COMPLIANCE_EVALUATION: 'Compliance',
        PROPOSAL_DRAFTING: 'Proposal',
        INDEPENDENT_AUDIT: 'Audit',
        HUMAN_APPROVED: 'Sign-Off',
        RELEASE_READY: 'Release'
      };

      const currentIndex = stageKeys.indexOf(currentStage) !== -1 ? stageKeys.indexOf(currentStage) : 3;

      return (
        <div className="bg-slate-900 border border-slate-800 rounded-xl p-4">
          <div className="flex items-center justify-between mb-2">
            <span className="text-xs font-bold uppercase tracking-wider text-slate-400">Collaborative Stage Pipeline</span>
            <span className="text-xs font-medium text-brand-400">Current: {stageLabels[currentStage] || currentStage}</span>
          </div>
          <div className="grid grid-cols-9 gap-1.5">
            {stageKeys.map((key, idx) => {
              const isPast = idx < currentIndex;
              const isCurrent = idx === currentIndex;
              return (
                <button
                  key={key}
                  onClick={() => onStageClick && onStageClick(key)}
                  className={`group relative text-center py-2 px-1 rounded transition text-xs font-medium ${
                    isCurrent
                      ? 'bg-brand-600 text-white shadow-lg shadow-brand-900/50 ring-2 ring-brand-400'
                      : isPast
                      ? 'bg-slate-800 text-slate-300 hover:bg-slate-700'
                      : 'bg-slate-950 text-slate-600 hover:text-slate-400'
                  }`}
                >
                  <div className="truncate">{stageLabels[key]}</div>
                  <div className="mt-1 flex justify-center">
                    {isPast ? (
                      <span className="text-emerald-400 text-[10px]">✓</span>
                    ) : isCurrent ? (
                      <span className="w-1.5 h-1.5 rounded-full bg-white animate-ping"></span>
                    ) : (
                      <span className="w-1.5 h-1.5 rounded-full bg-slate-700"></span>
                    )}
                  </div>
                </button>
              );
            })}
          </div>
        </div>
      );
    }

    // Main App Component
    function App() {
      // Authenticated User & Session State
      const [token, setToken] = useState(localStorage.getItem('tf_token') || '');
      const [user, setUser] = useState(null);
      const [authLoading, setAuthLoading] = useState(true);
      const [authError, setAuthError] = useState(null);
      const [authMode, setAuthMode] = useState('login'); // 'login' or 'register'
      const [loginEmail, setLoginEmail] = useState('admin@tenderforge.com');
      const [loginPassword, setLoginPassword] = useState('TenderForgeAdmin2026!');
      const [regFullName, setRegFullName] = useState('');
      const [regEmail, setRegEmail] = useState('');
      const [regPassword, setRegPassword] = useState('');
      const [regRole, setRegRole] = useState('Author');
      const [regOrg, setRegOrg] = useState('Apex Global Defense');

      // Switch Dynamic Integration Health
      const [switchStatus, setSwitchStatus] = useState({
        status: 'checking',
        message: 'Querying Switch integration...',
        agents_registered: 5,
        tools_registered: 31,
      });

      const checkAuthSession = async () => {
        const storedToken = localStorage.getItem('tf_token');
        if (!storedToken) {
          setUser(null);
          setAuthLoading(false);
          return;
        }
        try {
          const res = await apiFetch('/auth/me');
          if (res && res.success && res.data) {
            setUser(res.data);
          } else {
            localStorage.removeItem('tf_token');
            setToken('');
            setUser(null);
          }
        } catch (e) {
          localStorage.removeItem('tf_token');
          setToken('');
          setUser(null);
        } finally {
          setAuthLoading(false);
        }
      };

      const checkSwitchHealth = async () => {
        try {
          const res = await apiFetch('/switch/status');
          if (res && res.status) {
            setSwitchStatus(res);
          }
        } catch (e) {
          setSwitchStatus({ status: 'disconnected', message: 'Switch subsystem check failed' });
        }
      };

      const handleLogin = async (email, password) => {
        setAuthLoading(true);
        setAuthError(null);
        try {
          const res = await apiFetch('/auth/login', {
            method: 'POST',
            body: JSON.stringify({ email: email || loginEmail, password: password || loginPassword }),
          });
          if (res && res.success && res.data && res.data.access_token) {
            localStorage.setItem('tf_token', res.data.access_token);
            setToken(res.data.access_token);
            setUser(res.data.user);
            showToast(`Welcome back, ${res.data.user.full_name}!`);
          } else {
            setAuthError(res.message || 'Authentication failed. Please verify your credentials.');
          }
        } catch (e) {
          setAuthError(e.message || 'Login request error.');
        } finally {
          setAuthLoading(false);
        }
      };

      const handleRegister = async () => {
        setAuthLoading(true);
        setAuthError(null);
        try {
          const res = await apiFetch('/auth/register', {
            method: 'POST',
            body: JSON.stringify({
              email: regEmail,
              password: regPassword,
              full_name: regFullName,
              role: regRole,
              organization_name: regOrg,
            }),
          });
          if (res && res.success && res.data && res.data.access_token) {
            localStorage.setItem('tf_token', res.data.access_token);
            setToken(res.data.access_token);
            setUser(res.data.user);
            showToast(`Account created! Welcome, ${res.data.user.full_name}.`);
          } else {
            setAuthError(res.message || 'Registration failed.');
          }
        } catch (e) {
          setAuthError(e.message || 'Registration request error.');
        } finally {
          setAuthLoading(false);
        }
      };

      const handleLogout = async () => {
        try {
          await apiFetch('/auth/logout', { method: 'POST' });
        } catch (e) {}
        localStorage.removeItem('tf_token');
        setToken('');
        setUser(null);
        showToast('Logged out of TenderForge.');
      };

      // Navigation & Active Workspace
      const [activeTab, setActiveTab] = useState('portfolio'); // portfolio, workspace, documents, intelligence, criteria, bid_strategy, compliance, evidence, proposal, financial, risks, deadlines, war_room, deliverables, organizations
      const [tenders, setTenders] = useState([]);
      const [activeTenderId, setActiveTenderId] = useState(null);
      const [activeTender, setActiveTender] = useState(null);

      // Workspace Detailed States
      const [portfolioMetrics, setPortfolioMetrics] = useState(null);
      const [documents, setDocuments] = useState([]);
      const [requirements, setRequirements] = useState([]);
      const [criteria, setCriteria] = useState([]);
      const [bidEvaluation, setBidEvaluation] = useState(null);
      const [complianceMatrix, setComplianceMatrix] = useState([]);
      const [evidenceList, setEvidenceList] = useState([]);
      const [contradictions, setContradictions] = useState([]);
      const [proposal, setProposal] = useState(null);
      const [financialSummary, setFinancialSummary] = useState(null);
      const [boqItems, setBoqItems] = useState([]);
      const [risks, setRisks] = useState([]);
      const [deadlines, setDeadlines] = useState([]);
      const [organizations, setOrganizations] = useState([]);
      const [orgMembers, setOrgMembers] = useState([]);

      // Phase 5 States
      const [opportunities, setOpportunities] = useState([]);
      const [recommendations, setRecommendations] = useState([]);
      const [sources, setSources] = useState([]);
      const [snapshots, setSnapshots] = useState([]);
      const [amendments, setAmendments] = useState([]);
      const [awards, setAwards] = useState([]);
      const [marketSummary, setMarketSummary] = useState(null);
      const [competitors, setCompetitors] = useState([]);
      const [bidLearning, setBidLearning] = useState(null);
      const [submissions, setSubmissions] = useState([]);
      const [knowledgeAssets, setKnowledgeAssets] = useState([]);
      const [selectedMatch, setSelectedMatch] = useState(null);
      const [oppSearch, setOppSearch] = useState('');
      const [oppCategory, setOppCategory] = useState('');
      const [snapshotText, setSnapshotText] = useState('');
      const [ackNotes, setAckNotes] = useState('');
      const [submissionAmount, setSubmissionAmount] = useState('');
      const [newAssetTitle, setNewAssetTitle] = useState('');
      const [newAssetContent, setNewAssetContent] = useState('');
      const [newAssetCategory, setNewAssetCategory] = useState('technical_approach');

      // Switch War Room State
      const [warRoomEvents, setWarRoomEvents] = useState([
        { id: 1, agent: '@TenderAnalyst', role: 'Requirements Specialist', time: '14:02:11', message: 'Extracted 3 mandatory clauses from RFP notice with 98.4% cryptographic confidence.', status: 'success' },
        { id: 2, agent: '@ComplianceOfficer', role: 'Audit Engineer', time: '14:02:45', message: 'Generated Initial Compliance Matrix. Flagged ISO 27001 recertification due in 29 days.', status: 'warning' },
        { id: 3, agent: '@EvidenceResearcher', role: 'Knowledge Retriever', time: '14:03:12', message: 'Identified 2 cross-document financial contradictions on FY24 turnover.', status: 'error' },
        { id: 4, agent: '@ProposalArchitect', role: 'Content Synthesizer', time: '14:03:50', message: 'Generated 4 tailored response sections with criteria-aligned phrasing.', status: 'info' },
        { id: 5, agent: '@BidAuditor', role: 'Quality Sentinel', time: '14:04:20', message: 'Pre-flight hygiene scan completed. Ready for Executive Sign-Off.', status: 'success' },
      ]);
      const [chatInput, setChatInput] = useState('');

      // Modals & UI Controls
      const [proofLinkModal, setProofLinkModal] = useState(null);
      const [execOverrideModal, setExecOverrideModal] = useState(false);
      const [overrideRationale, setOverrideRationale] = useState('');
      const [resolveContradictionModal, setResolveContradictionModal] = useState(null);
      const [resolutionNotes, setResolutionNotes] = useState('');
      const [createTenderModal, setCreateTenderModal] = useState(false);
      const [newTenderForm, setNewTenderForm] = useState({
        title: '',
        reference_number: '',
        issuing_authority: '',
        estimated_value: 2500000,
        currency: 'USD',
      });
      const [toast, setToast] = useState(null);
      const [loading, setLoading] = useState(false);

      // Trigger Toast
      const showToast = (message, type = 'success') => {
        setToast({ message, type });
        setTimeout(() => setToast(null), 4000);
      };

      // Initial Data Loading
      useEffect(() => {
        checkAuthSession();
        checkSwitchHealth();
        loadTenders();
        loadPhase5Data();
        loadOrganizations();
      }, [token]);

      useEffect(() => {
        if (activeTenderId) {
          loadTenderDetails(activeTenderId);
        }
      }, [activeTenderId]);

      // Load Tenders
      async function loadTenders() {
        setLoading(true);
        const res = await apiFetch('/tenders');
        if (res && res.success && res.data) {
          const list = res.data.items || [];
          setTenders(list);
          if (list.length > 0 && !activeTenderId) {
            setActiveTenderId(list[0].id);
          }
        }
        setLoading(false);
      }

      // Load Organizations
      
      async function loadPhase5Data() {
        try {
          const [oppRes, recRes, srcRes, mktRes, compRes, learnRes, subRes, knRes, awdRes] = await Promise.all([
            apiFetch('/opportunities'),
            apiFetch('/opportunities/recommendations'),
            apiFetch('/sources'),
            apiFetch('/market/trends'),
            apiFetch('/market/competitors'),
            apiFetch('/analytics/bid-learning'),
            apiFetch('/submissions'),
            apiFetch('/knowledge/assets'),
            apiFetch('/market/awards'),
          ]);

          if (oppRes && oppRes.opportunities) setOpportunities(oppRes.opportunities);
          if (recRes && recRes.recommendations) setRecommendations(recRes.recommendations);
          if (srcRes && srcRes.sources) setSources(srcRes.sources);
          if (mktRes) setMarketSummary(mktRes);
          if (compRes && compRes.competitors) setCompetitors(compRes.competitors);
          if (learnRes) setBidLearning(learnRes);
          if (subRes && subRes.submissions) setSubmissions(subRes.submissions);
          if (knRes && knRes.assets) setKnowledgeAssets(knRes.assets);
          if (awdRes && awdRes.awards) setAwards(awdRes.awards);
        } catch (e) {
          console.error("Phase 5 load error", e);
        }
      }
      async function loadOrganizations() {
        const res = await apiFetch('/organizations');
        if (res && res.success && res.data) {
          setOrganizations(res.data);
          if (res.data.length > 0) {
            loadOrgMembers(res.data[0].id);
          }
        }
      }

      async function loadOrgMembers(orgId) {
        const res = await apiFetch(`/organizations/${orgId}/members`);
        if (res && res.success && res.data) {
          setOrgMembers(res.data);
        }
      }

      // Load Detailed Tender Data
      async function loadTenderDetails(tenderId) {
        setLoading(true);
        const [
          tndRes,
          docRes,
          reqRes,
          evalRes,
          compRes,
          evRes,
          contraRes,
          propRes,
          finRes,
          riskRes,
          dlRes
        ] = await Promise.all([
          apiFetch(`/tenders/${tenderId}`),
          apiFetch(`/documents?tender_id=${tenderId}`),
          apiFetch(`/tenders/${tenderId}/requirements`),
          apiFetch(`/tenders/${tenderId}/bid-evaluation`),
          apiFetch(`/compliance/matrix/${tenderId}`),
          apiFetch(`/evidence?tender_id=${tenderId}`),
          apiFetch(`/evidence/contradictions`),
          apiFetch(`/proposals/tender/${tenderId}`),
          apiFetch(`/financial/proposals/tender/${tenderId}`),
          apiFetch(`/tenders/${tenderId}/risks`),
          apiFetch(`/tenders/${tenderId}/deadlines`),
        ]);

        if (tndRes.success && tndRes.data) setActiveTender(tndRes.data);
        if (docRes.success && docRes.data) setDocuments(docRes.data.items || []);
        if (reqRes.success && reqRes.data) setRequirements(reqRes.data.requirements || []);
        if (evalRes.success && evalRes.data) setBidEvaluation(evalRes.data);
        if (compRes.success && compRes.data) setComplianceMatrix(compRes.data.items || []);
        if (evRes.success && evRes.data) setEvidenceList(evRes.data.items || []);
        if (contraRes.success && contraRes.data) setContradictions(contraRes.data.contradictions || []);
        if (propRes.success && propRes.data) setProposal(propRes.data);
        if (finRes.success && finRes.data) {
          setFinancialSummary(finRes.data);
          setBoqItems(finRes.data.items || []);
        }
        if (riskRes.success && riskRes.data) setRisks(riskRes.data || []);
        if (dlRes.success && dlRes.data) setDeadlines(dlRes.data || []);
        const [snapRes, amdRes] = await Promise.all([
          apiFetch(`/tenders/${tenderId}/snapshots`),
          apiFetch(`/tenders/${tenderId}/amendments`),
        ]);
        if (snapRes && snapRes.snapshots) setSnapshots(snapRes.snapshots);
        if (amdRes && amdRes.amendments) setAmendments(amdRes.amendments);

        setLoading(false);
      }

      // Handle Executive Bid Decision Override
      async function handleExecutiveDecision(decision) {
        if (!activeTenderId) return;
        setLoading(true);
        const res = await apiFetch(`/tenders/${activeTenderId}/bid-evaluation/decision`, {
          method: 'POST',
          body: JSON.stringify({
            decision: decision,
            rationale: overrideRationale || 'Executive authority pursuit approval.',
            sign_off_authority: user.full_name,
          }),
        });

        if (res.success) {
          showToast(`Executive decision recorded: ${decision}`);
          setExecOverrideModal(false);
          loadTenderDetails(activeTenderId);
        } else {
          showToast(res.message || 'Failed to record decision', 'error');
        }
        setLoading(false);
      }

      // Handle Contradiction Resolution
      async function handleResolveContradiction(contraId) {
        setLoading(true);
        const res = await apiFetch(`/evidence/contradictions/${contraId}/resolve`, {
          method: 'POST',
          body: JSON.stringify({
            status: 'Resolved',
            resolution_notes: resolutionNotes || 'Audited and verified against PwC annual financial statement.',
          }),
        });

        if (res.success) {
          showToast('Contradiction marked as Resolved.');
          setResolveContradictionModal(null);
          loadTenderDetails(activeTenderId);
        } else {
          showToast(res.message || 'Resolution failed', 'error');
        }
        setLoading(false);
      }

      // Create Opportunity
      async function handleCreateTender(e) {
        e.preventDefault();
        setLoading(true);
        const res = await apiFetch('/tenders', {
          method: 'POST',
          body: JSON.stringify(newTenderForm),
        });

        if (res.success && res.data) {
          showToast('New tender opportunity registered.');
          setCreateTenderModal(false);
          await loadTenders();
          setActiveTenderId(res.data.id);
        } else {
          showToast(res.message || 'Creation failed', 'error');
        }
        setLoading(false);
      }

      // Send War Room message
      function handleSendWarRoomMessage(e) {
        e.preventDefault();
        if (!chatInput.trim()) return;

        const newMsg = {
          id: Date.now(),
          agent: user.full_name,
          role: user.role,
          time: new Date().toLocaleTimeString(),
          message: chatInput,
          status: 'user'
        };

        setWarRoomEvents(prev => [...prev, newMsg]);
        setChatInput('');

        // Simulate intelligent agent response
        setTimeout(() => {
          setWarRoomEvents(prev => [
            ...prev,
            {
              id: Date.now() + 1,
              agent: '@ProposalArchitect',
              role: 'Content Synthesizer',
              time: new Date().toLocaleTimeString(),
              message: `Acknowledged instruction. Re-indexing proposal section alignment against evaluation criterion #3.`,
              status: 'info'
            }
          ]);
        }, 1200);
      }

      if (authLoading) {
        return (
          <div className="h-full flex items-center justify-center bg-slate-950 text-white font-sans">
            <div className="flex flex-col items-center gap-3">
              <div className="w-8 h-8 border-2 border-emerald-500 border-t-transparent rounded-full animate-spin"></div>
              <p className="text-xs text-slate-400 font-mono">Verifying TenderForge Security Session...</p>
            </div>
          </div>
        );
      }

      if (!user) {
        return (
          <div className="h-full flex items-center justify-center bg-slate-950 p-6 text-slate-100 font-sans">
            <div className="w-full max-w-md bg-slate-900 border border-slate-800 rounded-2xl p-8 shadow-2xl space-y-6">
              <div className="text-center space-y-2">
                <div className="w-12 h-12 rounded-xl bg-gradient-to-tr from-emerald-600 to-indigo-600 flex items-center justify-center text-white text-2xl mx-auto shadow-lg shadow-emerald-950">
                  ⚔️
                </div>
                <h1 className="text-xl font-bold text-white tracking-tight">TenderForge</h1>
                <p className="text-xs text-slate-400">From Tender to Trustworthy Proposal</p>
              </div>

              {authError && (
                <div className="p-3 bg-rose-950/80 border border-rose-800 text-rose-200 text-xs rounded-lg flex items-center gap-2">
                  <span>⚠️</span>
                  <span>{authError}</span>
                </div>
              )}

              <div className="flex border-b border-slate-800 text-xs">
                <button
                  onClick={() => { setAuthMode('login'); setAuthError(null); }}
                  className={`flex-1 py-2 font-semibold text-center border-b-2 transition ${authMode === 'login' ? 'border-emerald-500 text-emerald-400' : 'border-transparent text-slate-400 hover:text-slate-200'}`}
                >
                  Sign In

                        + Add Asset
                      </button>
                    </div>

                    <div className="grid grid-cols-1 md:grid-cols-2 gap-3 text-xs">
                      <input
                        type="text"
                        placeholder="Asset Title e.g., Cloud Security Framework"
                        value={newAssetTitle}
                        onChange={(e) => setNewAssetTitle(e.target.value)}
                        className="bg-slate-950 border border-slate-800 rounded-lg p-2 text-white placeholder-slate-500 focus:outline-none"
                      />
                      <select
                        value={newAssetCategory}
                        onChange={(e) => setNewAssetCategory(e.target.value)}
                        className="bg-slate-950 border border-slate-800 rounded-lg p-2 text-white focus:outline-none"
                      >
                        <option value="technical_approach">Technical Approach</option>
                        <option value="executive_summary">Executive Summary</option>
                        <option value="compliance_boilerplate">Compliance Boilerplate</option>
                        <option value="methodology">Methodology</option>
                      </select>
                    </div>
                    <textarea
                      rows={2}
                      placeholder="Verified proposal narrative content..."
                      value={newAssetContent}
                      onChange={(e) => setNewAssetContent(e.target.value)}
                      className="w-full bg-slate-950 border border-slate-800 rounded-lg p-2 text-xs text-white placeholder-slate-500 focus:outline-none"
                    />

                    {/* Assets Grid */}
                    <div className="grid grid-cols-1 md:grid-cols-2 gap-4 pt-2">
                      {knowledgeAssets.map((asset) => (
                        <div key={asset.id} className="bg-slate-950 border border-slate-800 rounded-lg p-3.5 space-y-2">
                          <div className="flex items-center justify-between">
                            <span className="font-bold text-white text-xs">{asset.title}</span>
                            <span className="px-1.5 py-0.5 rounded text-[9px] uppercase font-bold bg-emerald-500/10 text-emerald-400">
                              {asset.review_status}
                            </span>
                          </div>
                          <p className="text-[11px] text-slate-400 line-clamp-2">{asset.plain_text}</p>
                          <div className="flex items-center justify-between pt-1 text-[10px] text-slate-500">
                            <span>Reused {asset.times_reused || 0} times</span>
                            <button
                              onClick={async () => {
                                await apiFetch(`/knowledge/assets/${asset.id}/reuse`, { method: 'POST', body: JSON.stringify({}) });
                                showToast(`Injected '${asset.title}' into active proposal draft.`);
                                await loadPhase5Data();
                              }}
                              className="text-brand-400 hover:text-brand-300 font-semibold"
                            >
                              Insert in Proposal
                            </button>
                          </div>
                        </div>
                      ))}
                    </div>
                  </div>
                </div>
              )}

            </div>
          </main>

          {/* MODAL 1: PROOFLINK SOURCE CITATION VIEWER */}
          {proofLinkModal && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-xl w-full p-6 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">🔗</span>
                    <h3 className="font-bold text-white text-base">ProofLink Source Citation Verification</h3>
                  </div>
                  <button onClick={() => setProofLinkModal(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <div className="mt-4 space-y-4 text-xs">
                  <div>
                    <span className="text-slate-400 uppercase font-mono text-[10px]">Requirement Clause:</span>
                    <div className="text-white font-medium mt-1">{proofLinkModal.description || proofLinkModal.title}</div>
                  </div>
                  <div className="p-3 bg-slate-950 rounded-lg border border-slate-800">
                    <span className="text-slate-400 uppercase font-mono text-[10px]">Verbatim Document Excerpt:</span>
                    <p className="text-brand-300 font-mono mt-1 leading-relaxed">
                      "{proofLinkModal.source_excerpt || 'Clause verbatim extract verified against page 1'}"
                    </p>
                  </div>
                  <div className="grid grid-cols-2 gap-3 pt-2">
                    <div>
                      <span className="text-slate-400 text-[10px]">Page Reference:</span>
                      <div className="font-mono text-white">Page {proofLinkModal.source_page || 1}</div>
                    </div>
                    <div>
                      <span className="text-slate-400 text-[10px]">Confidence Level:</span>
                      <div className="font-mono text-emerald-400">98.4% (Zero Hallucination)</div>
                    </div>
                  </div>
                </div>
                <div className="mt-6 pt-3 border-t border-slate-800 flex justify-end">
                  <button
                    onClick={() => setProofLinkModal(null)}
                    className="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-white rounded-lg text-xs font-semibold"
                  >
                    Close
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 2: EXECUTIVE SIGN-OFF & OVERRIDE */}
          {execOverrideModal && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">🏛️</span>
                    <h3 className="font-bold text-white text-base">Executive Authority Sign-Off</h3>
                  </div>
                  <button onClick={() => setExecOverrideModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <div className="mt-4 space-y-4 text-xs">
                  <p className="text-slate-300">
                    Pursuant to TenderForge Enterprise Governance, executive authority is required to authorize bid release or override advisory no-bid recommendations.
                  </p>
                  <div>
                    <label className="text-slate-400 font-semibold uppercase text-[10px]">Executive Rationale (Mandatory Audit Requirement):</label>
                    <textarea
                      rows="3"
                      value={overrideRationale}
                      onChange={(e) => setOverrideRationale(e.target.value)}
                      placeholder="State commercial, strategic, or risk mitigation justification..."
                      className="w-full mt-1.5 bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-brand-500"
                    />
                  </div>
                </div>
                <div className="mt-6 pt-4 border-t border-slate-800 flex justify-end gap-2">
                  <button
                    onClick={() => handleExecutiveDecision('APPROVED_NO_BID')}
                    className="px-4 py-2 bg-rose-700 hover:bg-rose-600 text-white rounded-lg text-xs font-semibold"
                  >
                    Authorize No-Bid
                  </button>
                  <button
                    onClick={() => handleExecutiveDecision('APPROVED_BID')}
                    className="px-4 py-2 bg-emerald-600 hover:bg-emerald-500 text-white rounded-lg text-xs font-semibold shadow-sm"
                  >
                    Authorize Bid Pursuit
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 3: CONTRADICTION RESOLVER */}
          {resolveContradictionModal && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <div className="flex items-center gap-2">
                    <span className="text-xl">⚖️</span>
                    <h3 className="font-bold text-white text-base">Evidence Contradiction Resolution</h3>
                  </div>
                  <button onClick={() => setResolveContradictionModal(null)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <div className="mt-4 space-y-4 text-xs">
                  <div className="p-3 bg-slate-950 rounded-lg border border-slate-800 space-y-1">
                    <span className="text-rose-400 font-bold uppercase text-[10px]">Contradiction on '{resolveContradictionModal.claim_field}'</span>
                    <div className="text-slate-300">Document A: "{resolveContradictionModal.value_1}"</div>
                    <div className="text-slate-300">Document B: "{resolveContradictionModal.value_2}"</div>
                  </div>
                  <div>
                    <label className="text-slate-400 font-semibold uppercase text-[10px]">Resolution Notes & Audited Source:</label>
                    <textarea
                      rows="3"
                      value={resolutionNotes}
                      onChange={(e) => setResolutionNotes(e.target.value)}
                      className="w-full mt-1.5 bg-slate-950 border border-slate-800 rounded-lg p-2.5 text-xs text-white focus:outline-none focus:border-brand-500"
                    />
                  </div>
                </div>
                <div className="mt-6 pt-3 border-t border-slate-800 flex justify-end gap-2">
                  <button
                    onClick={() => setResolveContradictionModal(null)}
                    className="px-3 py-1.5 bg-slate-800 text-slate-300 rounded text-xs"
                  >
                    Cancel
                  </button>
                  <button
                    onClick={() => handleResolveContradiction(resolveContradictionModal.id)}
                    className="px-4 py-1.5 bg-emerald-600 hover:bg-emerald-500 text-white rounded text-xs font-semibold"
                  >
                    Save Resolution
                  </button>
                </div>
              </div>
            </div>
          )}

          {/* MODAL 4: CREATE OPPORTUNITY */}
          {createTenderModal && (
            <div className="fixed inset-0 z-50 bg-black/70 backdrop-blur-sm flex items-center justify-center p-4">
              <div className="bg-slate-900 border border-slate-700 rounded-2xl max-w-lg w-full p-6 shadow-2xl">
                <div className="flex items-center justify-between pb-3 border-b border-slate-800">
                  <h3 className="font-bold text-white text-base">Register New Tender Opportunity</h3>
                  <button onClick={() => setCreateTenderModal(false)} className="text-slate-400 hover:text-white">✕</button>
                </div>
                <form onSubmit={handleCreateTender} className="mt-4 space-y-3 text-xs">
                  <div>
                    <label className="text-slate-400 uppercase text-[10px] font-bold">Tender Opportunity Title</label>
                    <input
                      type="text"
                      required
                      value={newTenderForm.title}
                      onChange={(e) => setNewTenderForm({ ...newTenderForm, title: e.target.value })}
                      placeholder="e.g. Joint Multi-Domain Command & Control (JADC2) Cloud Integration"
                      className="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-500"
                    />
                  </div>
                  <div>
                    <label className="text-slate-400 uppercase text-[10px] font-bold">Reference Number / RFP ID</label>
                    <input
                      type="text"
                      required
                      value={newTenderForm.reference_number}
                      onChange={(e) => setNewTenderForm({ ...newTenderForm, reference_number: e.target.value })}
                      placeholder="e.g. RFP-2026-CLOUD-99"
                      className="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-500"
                    />
                  </div>
                  <div>
                    <label className="text-slate-400 uppercase text-[10px] font-bold">Issuing Authority / Client</label>
                    <input
                      type="text"
                      value={newTenderForm.issuing_authority}
                      onChange={(e) => setNewTenderForm({ ...newTenderForm, issuing_authority: e.target.value })}
                      placeholder="e.g. Department of Defense / Air Force Research Lab"
                      className="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-500"
                    />
                  </div>
                  <div className="grid grid-cols-2 gap-3">
                    <div>
                      <label className="text-slate-400 uppercase text-[10px] font-bold">Estimated Value</label>
                      <input
                        type="number"
                        value={newTenderForm.estimated_value}
                        onChange={(e) => setNewTenderForm({ ...newTenderForm, estimated_value: parseFloat(e.target.value) })}
                        className="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-500 font-mono"
                      />
                    </div>
                    <div>
                      <label className="text-slate-400 uppercase text-[10px] font-bold">Currency</label>
                      <input
                        type="text"
                        value={newTenderForm.currency}
                        onChange={(e) => setNewTenderForm({ ...newTenderForm, currency: e.target.value })}
                        className="w-full mt-1 bg-slate-950 border border-slate-800 rounded-lg px-3 py-2 text-white focus:outline-none focus:border-brand-500 font-mono"
                      />
                    </div>
                  </div>
                  <div className="mt-6 pt-3 border-t border-slate-800 flex justify-end gap-2">
                    <button
                      type="button"
                      onClick={() => setCreateTenderModal(false)}
                      className="px-3 py-1.5 bg-slate-800 text-slate-300 rounded text-xs"
                    >
                      Cancel
                    </button>
                    <button
                      type="submit"
                      className="px-4 py-1.5 bg-brand-600 hover:bg-brand-500 text-white rounded text-xs font-semibold"
                    >
                      Create Opportunity
                    </button>
                  </div>
                </form>
              </div>
            </div>
          )}
        </div>
      );
    }

    // Render the React Application
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
